<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Our Anniversary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="heart-field" aria-hidden="true"></div>

    <header class="nav">
      <a class="mark" href="#top">ours</a>
      <nav>
        <a href="#story">Story</a>
        <a href="#gallery">Gallery</a>
        <a href="#letter">Letter</a>
        <a href="#reasons">Reasons</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero">
        <p class="kicker" id="days-line">A private celebration</p>
        <h1 id="hero-title">Happy Anniversary</h1>
        <p class="names" id="hero-names"></p>
        <p class="tagline" id="hero-tagline"></p>
        <a class="scroll-hint" href="#story">open our story ↓</a>
      </section>

      <section id="story" class="story reveal">
        <p class="section-kicker">the chapters</p>
        <h2>How we got here</h2>
        <div class="timeline" id="timeline"></div>
      </section>

      <section id="gallery" class="gallery reveal">
        <p class="section-kicker">the album</p>
        <h2>Little proofs we were here</h2>
        <p class="lede">Tap a frame.</p>
        <div class="polaroids" id="gallery-grid"></div>
      </section>

      <section id="letter" class="letter-section reveal">
        <p class="section-kicker">for you</p>
        <h2>A letter, sealed with a click</h2>
        <button class="envelope" id="envelope" type="button" aria-expanded="false">
          <span class="flap"></span>
          <span class="pocket">
            <span class="wax">♥</span>
            <span class="envelope-label">Open me</span>
          </span>
        </button>
        <article class="letter-paper" id="letter-paper" hidden>
          <p class="letter-to" id="letter-to"></p>
          <div id="letter-body"></div>
          <p class="letter-from" id="letter-from"></p>
        </article>
      </section>

      <section id="reasons" class="reasons reveal">
        <p class="section-kicker">because</p>
        <h2>A handful of reasons</h2>
        <ul class="reason-list" id="reason-list"></ul>
      </section>
    </main>

    <footer>
      <p id="footer-line"></p>
    </footer>

    <div class="lightbox" id="lightbox" hidden>
      <button class="lightbox-close" type="button" aria-label="Close">×</button>
      <img id="lightbox-img" alt="" />
      <p id="lightbox-caption"></p>
    </div>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
